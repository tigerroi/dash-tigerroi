name: TigerROI Sync Country ROI

on:
  # Terjadwal setiap 1 jam
  schedule:
    - cron: "45 * * * *"
  # Tombol pemicu manual dari tab Actions di GitHub
  workflow_dispatch:
    inputs:
      start_date:
        description: "Tanggal mulai (YYYY-MM-DD) - kosongkan untuk otomatis semua campaign"
        required: false
        default: ""
      end_date:
        description: "Tanggal akhir (YYYY-MM-DD) - kosongkan untuk otomatis"
        required: false
        default: ""

concurrency:
  group: sync-country-roi
  cancel-in-progress: false

jobs:
  sync-country:
    name: Sinkronisasi ROI per Negara ke Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Kode Repositori
        uses: actions/checkout@v4

      - name: Siapkan Lingkungan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Pasang Dependensi
        run: npm ci --omit=dev || npm install --omit=dev

      - name: Jalankan Sinkronisasi ROI per Negara
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          GAM_CLIENT_EMAIL: ${{ secrets.GAM_CLIENT_EMAIL }}
          GAM_PRIVATE_KEY: ${{ secrets.GAM_PRIVATE_KEY }}
          GAM_SERVICE_ACCOUNT_JSON: ${{ secrets.GAM_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "${{ github.event.inputs.start_date }}" ] && [ -n "${{ github.event.inputs.end_date }}" ]; then
            node jobs/sync-country-roi.js "${{ github.event.inputs.start_date }}" "${{ github.event.inputs.end_date }}"
          elif [ -n "${{ github.event.inputs.start_date }}" ]; then
            node jobs/sync-country-roi.js "${{ github.event.inputs.start_date }}"
          else
            node jobs/sync-country-roi.js
          fi
