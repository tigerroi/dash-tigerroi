# Perintah di CLAUDE.md, dijalankan otomatis. Selama hanya dijalankan kalau ada yang
# ingat, sebuah gerbang bukan gerbang — dan `biome check` sempat merah cukup lama tanpa ada yang
# menyalakannya.
name: CI

on:
  push:
  pull_request:
    branches: [main]

# Push berikutnya membatalkan run yang masih berjalan di branch yang sama; yang menarik hanya
# hasil commit terakhir.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Sama dengan `engines.node` di functions/package.json — sync terjadwal berjalan di runtime
      # itu, jadi tesnya tidak boleh lulus di versi lain.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Test (frontend)
        run: npm test

      - name: Build
        run: |
          cp .env.example .env
          npm run build
