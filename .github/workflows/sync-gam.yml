name: TigerROI Sync Google Ad Manager

on:
  # Terjadwal setiap 1 jam tepat (00:00, 01:00, 02:00, ..., 23:00)
  schedule:
    - cron: "0 * * * *"
  # Tombol pemicu manual dari tab Actions di GitHub
  workflow_dispatch:
    inputs:
      days_back:
        description: "Jumlah hari ke belakang (isi 45 untuk tarik bulan Oktober)"
        required: false
        default: "45"
      allow_past_months:
        description: "Bolehkan tarik bulan lampau (Oktober)?"
        type: boolean
        default: true
  # Pemicu instan via GitHub API Webhook (tanpa antrean cron GitHub)
  repository_dispatch:
    types: [hourly-sync]

concurrency:
  group: sync-gam
  cancel-in-progress: false

jobs:
  sync-gam:
    name: Sinkronisasi GAM ke Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Kode Repositori
        uses: actions/checkout@v4

      - name: Siapkan Lingkungan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Pasang Dependensi
        run: npm ci --omit=dev || npm install --omit=dev

      - name: Jalankan Sinkronisasi Google Ad Manager
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GAM_CLIENT_EMAIL: ${{ secrets.GAM_CLIENT_EMAIL }}
          GAM_PRIVATE_KEY: ${{ secrets.GAM_PRIVATE_KEY }}
          DAYS_BACK: ${{ github.event.inputs.days_back || '7' }}
          ALLOW_PAST_MONTHS: ${{ github.event.inputs.allow_past_months || 'false' }}
        run: node jobs/sync-gam.js

