name: TigerROI Sync Keitaro Tracker

on:
  # Terjadwal setiap 30 menit
  schedule:
    - cron: "*/30 * * * *"
  # Pemicu manual dari tab Actions di GitHub
  workflow_dispatch:
    inputs:
      start_date:
        description: "Tanggal mulai (YYYY-MM-DD) - kosongkan untuk hari berjalan"
        required: false
        default: "2026-10-01"
      end_date:
        description: "Tanggal akhir (YYYY-MM-DD) - kosongkan untuk hari berjalan"
        required: false
        default: "2026-10-31"

concurrency:
  group: sync-keitaro
  cancel-in-progress: false

jobs:
  sync-keitaro:
    name: Sinkronisasi Keitaro ke Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Kode Repositori
        uses: actions/checkout@v4

      - name: Siapkan Lingkungan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Pasang Dependensi
        run: npm ci --omit=dev || npm install --omit=dev

      - name: Jalankan Sinkronisasi Keitaro
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KEITARO_URL: ${{ secrets.KEITARO_URL || 'https://appscity.tech' }}
          KEITARO_API_KEY: ${{ secrets.KEITARO_API_KEY }}
          START_DATE: ${{ github.event.inputs.start_date }}
          END_DATE: ${{ github.event.inputs.end_date }}
        run: node jobs/sync-keitaro.js

